<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Leave a review for Collie Handyman Services LLC.">
  <title>Leave a Review | Collie Handyman Services LLC</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="review-page">
  <header class="review-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="Collie Handyman Services home">
        <img src="assets/logo.png" alt="Collie Handyman Services LLC logo">
      </a>
      <a class="btn btn-outline" href="index.html">Back to Home</a>
    </div>
  </header>

  <main class="quote-section">
    <div class="container">
      <div class="review-intro">
        <p class="eyebrow">SHARE YOUR EXPERIENCE</p>
        <h1>Leave a review.</h1>
        <p>Thank you for choosing Collie Handyman Services LLC. Your feedback helps us improve and helps other homeowners feel confident calling us.</p>
      </div>

      <form class="quote-form review-form" action="https://formsubmit.co/colliezach27@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="New Customer Review — Collie Handyman Services LLC">
        <input type="hidden" name="_next" value="https://colliehandymanservices.com/review-thanks.html">
        <input type="hidden" name="_template" value="table">
        <input class="honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label>Name<input name="name" required></label>
        <label>City / area <span aria-hidden="true">(optional)</span><input name="area"></label>
        <label>Email <span aria-hidden="true">(optional)</span><input name="email" type="email"></label>
        <label>Your review<textarea name="message" rows="7" required></textarea></label>
        <label class="check-label"><input name="permission_to_share" type="checkbox" value="Yes — Collie Handyman Services LLC may share my review." required>I give Collie Handyman Services LLC permission to share my review.</label>
        <button class="btn btn-gold" type="submit">Send My Review</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container copyright">© <span id="year"></span> Collie Handyman Services LLC. All rights reserved.</div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
